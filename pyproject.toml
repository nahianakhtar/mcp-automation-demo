[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[project]
name = "recon-mcp"
version = "0.1.0"
description = "Offline invoice and expense reconciliation MCP server and CLI"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
recon = "recon_mcp.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
