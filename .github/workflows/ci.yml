name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: UV_OFFLINE=1 uv run --offline ruff check .

      - name: Check formatting with ruff
        run: UV_OFFLINE=1 uv run --offline ruff format --check .

      - name: Run offline test suite
        run: UV_OFFLINE=1 uv run --offline pytest -q
